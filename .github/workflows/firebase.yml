# Tests the security rules on every PR that touches the server side, and deploys
# functions + database rules when those changes land on master.
#
# One-time setup: add a repository secret FIREBASE_SERVICE_ACCOUNT containing a
# service-account JSON key for echat-888ef (Firebase console > Project settings >
# Service accounts > Generate new private key). Without it, deploy is skipped.
#
# Storage rules are deployed only from a manual run with "with_storage" ticked,
# after the new app build is released (older builds upload to blocked paths).

name: Firebase

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase-tests/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "scripts/deploy_firebase.sh"
  push:
    branches: [master]
    paths:
      - "functions/**"
      - "firebase-tests/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "scripts/deploy_firebase.sh"
  workflow_dispatch:
    inputs:
      with_storage:
        description: "Also deploy storage rules (only after the new app build is out)"
        type: boolean
        default: false

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - name: Check functions load
        run: |
          cd functions && npm ci
          node --check index.js
      - name: Security rule tests
        run: cd firebase-tests && npm ci && npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip when the service-account secret is missing
        if: env.HAS_KEY != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set, skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
      - if: env.HAS_KEY == 'true'
        run: npm install -g firebase-tools
      - name: Deploy
        if: env.HAS_KEY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          FLAGS="--skip-tests"
          if [ "${{ inputs.with_storage }}" = "true" ]; then FLAGS="$FLAGS --with-storage"; fi
          scripts/deploy_firebase.sh $FLAGS
