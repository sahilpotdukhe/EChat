name: echat
description: "EChat: a Flutter chat app with voice and video calls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore:
  permission_handler: ^13.0.2
  firebase_auth:
  google_sign_in:
  firebase_core:
  intl:
  image_picker:
  path_provider:
  provider:
  cached_network_image:
  agora_rtc_engine: ^6.6.4
  http:
  fast_contacts:
  file_picker: ^13.1.0
  video_player:
  shared_preferences:
  lottie: ^3.6.1
  firebase_messaging:
  awesome_notifications: ^0.12.1
  flutter_native_splash:
  hive_ce: ^2.20.1
  pdfrx: ^2.6.5
  fc_native_video_thumbnail: ^3.0.1
  url_launcher: ^6.3.3
  # Shared shadcn-style components: github.com/sahilpotdukhe/shadcn_kit
  # (private). Uses the `github-personal` SSH host from ~/.ssh/config.
  # Bump `ref` to a newer tag to take kit updates. To edit the kit locally,
  # see pubspec_overrides.yaml.example.
  shadcn_kit:
    git:
      url: git@github-personal:sahilpotdukhe/shadcn_kit.git
      ref: v0.2.1
  supabase_flutter: ^2.18.3
  connectivity_plus: ^7.3.2
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Only the files the app loads at runtime. The images in
  # assets/native_splash are inputs for flutter_native_splash (it copies them
  # into the platform projects), so they are not bundled a second time.
  assets:
    - assets/email.json
    - assets/google_loader.json
    - assets/first.png
    - assets/second.png
    - assets/third.png
    - assets/login.png
    - assets/logs.png
    - assets/nomessage.png
    - assets/logo.png

# Native splash screen. After changing anything here, run:
#   dart run flutter_native_splash:create
# The pictures in assets/native_splash are made from the master art in
# docs/branding (splash_master.png and signature_master.png) by
# docs/branding/generate_icons.py.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/native_splash/splash.png
  branding: assets/native_splash/branding.png
  branding_mode: bottom
  # Lifts the signature clear of the phone's gesture bar.
  branding_bottom_padding: 24

  # Dark mode: the app's dark background, a white wordmark and a faint violet
  # glow behind the logo.
  color_dark: "#0F0F14"
  image_dark: assets/native_splash/splash_dark.png
  branding_dark: assets/native_splash/branding_dark.png

  # Android 12+ draws its own splash (icon clipped to a circle).
  android_12:
    image: assets/native_splash/android12.png
    color: "#FFFFFF"
    branding: assets/native_splash/branding.png
    image_dark: assets/native_splash/android12_dark.png
    color_dark: "#0F0F14"
    branding_dark: assets/native_splash/branding_dark.png
